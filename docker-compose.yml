services:
  mysql:
    image: mysql:8.0
    container_name: mysql-berkah
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - ./db_berkah_jaya.sql:/docker-entrypoint-initdb.d/db_berkah_jaya.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
